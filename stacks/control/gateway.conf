# control-gateway: unica ponte do HomeLab Control com o host e a rede "monitoring".
#   :8088  entrada publicada em 127.0.0.1 (tunel SSH) -> homelab-control:8088 (so GET/HEAD)
#   :8081  GET /containers/json?all=1  -> socket-proxy (lista; sem inspect, logs, stats, exec...)
#   :8082  GET /metrics                -> uptime-kuma (a chave segue no cabecalho Authorization)
# Caminho ou parametro diferente: 403. Metodo diferente de GET/HEAD: 403.

# DNS interno do Docker, resolvido sob demanda (o gateway sobe mesmo com um servico fora do ar).
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 3s;

proxy_http_version 1.1;
proxy_connect_timeout 3s;
proxy_read_timeout 5s;
proxy_send_timeout 5s;
proxy_buffering on;
proxy_max_temp_file_size 0;
proxy_redirect off;
proxy_set_header Connection "";
client_max_body_size 0;
server_tokens off;
access_log off;

map $request_method $hl_method_ok { GET 1; HEAD 1; default 0; }

# Saude do proprio gateway (healthcheck do contêiner).
server {
  listen 8080;
  location = /healthz { return 200 "ok\n"; }
  location / { return 403; }
}

# Entrada do painel/API (publicada so em 127.0.0.1:8088 pelo Compose).
server {
  listen 8088;
  set $control_upstream http://homelab-control:8088;
  location / {
    if ($hl_method_ok = 0) { return 403; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_pass $control_upstream;
  }
}

# Docker: somente a listagem de conteineres.
server {
  listen 8081;
  set $docker_upstream http://socket-proxy:2375;
  location = /containers/json {
    if ($hl_method_ok = 0) { return 403; }
    if ($args != "all=1") { return 403; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_pass $docker_upstream;
  }
  location / { return 403; }
}

# Uptime Kuma: somente /metrics.
server {
  listen 8082;
  set $kuma_upstream http://uptime-kuma:3001;
  location = /metrics {
    if ($hl_method_ok = 0) { return 403; }
    if ($args != "") { return 403; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass $kuma_upstream;
  }
  location / { return 403; }
}
