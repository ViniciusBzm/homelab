# HomeLab Control (M4.4) - projeto Compose "control", separado da stack "monitoring" (M3).
#   homelab-control  API + painel (somente leitura)       -> 127.0.0.1:8088 (acesso por tunel SSH)
#   control-gateway  ponte restrita ao Docker/Kuma (nginx) -> sem portas publicadas
# Redes:
#   control_edge      bridge comum, so para publicar 127.0.0.1:8088
#   control_internal  internal: true (sem saida), Control <-> gateway
#   monitoring        EXTERNA (criada pelo M3); so o gateway entra nela
# A stack do M3 nao e alterada: nenhum servico dela e declarado aqui.
name: control

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  control-gateway:
    <<: *hardening
    image: ${GATEWAY_IMAGE:?defina GATEWAY_IMAGE (versao fixa) no .env}
    container_name: control-gateway
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [control_internal, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 32

  homelab-control:
    <<: *hardening
    image: homelab-control:${CONTROL_TAG:?defina CONTROL_TAG (commit) no .env}
    container_name: homelab-control
    user: "1000:1000"
    depends_on:
      control-gateway: { condition: service_healthy }
    environment:
      HL_CONTROL_LABEL: ${HL_CONTROL_LABEL:-homelab}
      HL_CONTROL_DOCKER_URL: http://control-gateway:8081
      HL_CONTROL_KUMA_URL: http://control-gateway:8082
      HL_CONTROL_KUMA_API_KEY_FILE: /run/secrets/kuma_api_key
    volumes:
      # Somente os dois arquivos de status (0644), nunca o repositorio restic, a senha ou o export.
      - /var/backups/homelab-backup.status:/var/backups/homelab-backup.status:ro
      - /var/backups/homelab-restore-test.status:/var/backups/homelab-restore-test.status:ro
    secrets: [kuma_api_key]
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8088:8088"
    networks: [control_edge, control_internal]
    mem_limit: 160m
    cpus: 0.5
    pids_limit: 64

secrets:
  kuma_api_key:
    file: ./secrets/kuma_api_key   # fora do Git; 0600, dono = administrador (uid 1000)

networks:
  control_edge:
    name: control_edge
  control_internal:
    name: control_internal
    internal: true
  monitoring:
    name: monitoring
    external: true
